name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: host
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun run check:lock
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bunx sproutboat check
      - name: Prepare native ARM static compiler
        if: matrix.target == 'host'
        run: |
          printf '#!/bin/sh\nexec gcc -static "$@"\n' > "$RUNNER_TEMP/risulta-cc"
          printf '#!/bin/sh\nexec g++ -static "$@"\n' > "$RUNNER_TEMP/risulta-cxx"
          chmod +x "$RUNNER_TEMP/risulta-cc" "$RUNNER_TEMP/risulta-cxx"
          echo "CC=$RUNNER_TEMP/risulta-cc" >> "$GITHUB_ENV"
          echo "CXX=$RUNNER_TEMP/risulta-cxx" >> "$GITHUB_ENV"
      - name: Build standalone binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$BUILD_TARGET" = host ]; then
            bun run build --target host
          else
            bun run build
          fi
          if readelf -l dist/risulta-sprout | grep -q INTERP; then
            echo 'The binary must be statically linked.' >&2
            exit 1
          fi
      - name: Verify standalone binary in both proxy modes
        run: sh scripts/verify-binary.sh dist/risulta-sprout
