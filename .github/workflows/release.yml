name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: risulta-sprout-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: risulta-sprout-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - name: Build ${{ matrix.artifact }}
        run: |
          bunx sproutboat build --standalone
          mv dist/risulta-sprout "${{ matrix.artifact }}"
      - name: Create checksum
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
