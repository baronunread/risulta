name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test.js

  build:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: bun-linux-x64-baseline
            artifact: risulta-linux-x64
          - target: bun-linux-arm64
            artifact: risulta-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.artifact }}
        run: |
          RISULTA_VERSION="${GITHUB_REF_NAME}" RISULTA_BUILD_TARGET="${{ matrix.target }}" RISULTA_BUILD_OUTFILE="${{ matrix.artifact }}" bun run build
      - name: Create checksum
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release manifest
        run: node scripts/release-manifest.mjs "$GITHUB_REF_NAME" dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
